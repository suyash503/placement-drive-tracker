micronaut.application.name=placement-tracker
micronaut.server.port=${PORT:8080}

# ---------- Database ----------
# Values come from environment variables so the same jar works on my laptop,
# in docker-compose and on Kubernetes. The part after ":" is the default.
datasources.default.url=${DB_URL:`jdbc:mysql://localhost:3306/placement`}
datasources.default.username=${DB_USER:placement}
datasources.default.password=${DB_PASSWORD:placement}
datasources.default.driver-class-name=com.mysql.cj.jdbc.Driver
datasources.default.db-type=mysql
datasources.default.dialect=MYSQL

# Liquibase owns the schema, so Hibernate must NOT create/alter tables
jpa.default.properties.hibernate.hbm2ddl.auto=none
jpa.default.properties.hibernate.show_sql=false

# ---------- Liquibase ----------
liquibase.datasources.default.change-log=classpath:db/liquibase-changelog.xml
# "demo" context loads sample companies/students so the dashboard isn't empty
liquibase.datasources.default.contexts=${LIQUIBASE_CONTEXTS:demo}

# ---------- Health checks (used by Kubernetes probes) ----------
endpoints.health.enabled=true
endpoints.health.sensitive=false

# ---------- Swagger UI at /swagger-ui ----------
micronaut.router.static-resources.swagger-ui.mapping=/swagger-ui/**
micronaut.router.static-resources.swagger-ui.paths=classpath:META-INF/swagger/views/swagger-ui
micronaut.router.static-resources.swagger.mapping=/swagger/**
micronaut.router.static-resources.swagger.paths=classpath:META-INF/swagger
