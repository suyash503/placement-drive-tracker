# Tests start a throwaway MySQL 8 container using Testcontainers (Docker must be running)
datasources.default.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
datasources.default.url=jdbc:tc:mysql:8.4:///placement
datasources.default.username=test
datasources.default.password=test

# Don't load the demo data in tests, so every test starts from a clean database
liquibase.datasources.default.contexts=test
